name: 學會活動監測

on:
  schedule:
    # 每日 02:00 UTC = 10:00 台灣時間，與日報的 08:45／09:05 錯開
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: '首次執行：只建立狀態檔不推播（填 true）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # 最壞情況實測約 11 分鐘（7 個 URL × 重試 3 次 × timeout 30s ＋ 退避）。
    # Actions 預設是 360 分鐘，遇到慢速滴水的伺服器會空轉數小時佔住額度，
    # 不如快死快重試——狀態檔只在推播成功後才寫，被砍不會漏報，只會重推。
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests beautifulsoup4

      - name: Run society watch
        env:
          # Actions 的 log 是 pipe，stdout 會 block-buffered 而 stderr 不會，
          # 出事時 traceback 會跟「哪一站失敗」完全錯位，排查困難
          PYTHONUNBUFFERED: "1"
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          if [ "${{ github.event.inputs.bootstrap }}" = "true" ]; then
            python3 -m society_watch.main --bootstrap
          else
            python3 -m society_watch.main
          fi

      - name: Commit state
        # always()：告警送出後 save_alerts 已寫檔，若接著事件推播失敗就跳過
        # commit，7 天冷卻紀錄會遺失而隔天重複告警。加上它沒有反向風險——
        # state.py 的每個 save_* 都排在對應的 push_line 之後，磁碟上出現的
        # 狀態永遠只代表「已經送出去的東西」。
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 必須用 -A：git add 只要有一個 pathspec 不存在就整條 exit 128
          # 且什麼都不 stage（實測）。而 alert_state.json 只在有失敗時產生、
          # heartbeat.json 只在當月第一次執行時產生，bootstrap 更是兩個都不會有。
          # 逐檔列舉等於保證第一次就 fatal，狀態永遠 commit 不回去 → 每天重推全部。
          # society_watch/ 底下只有 .py 與狀態檔，__pycache__ 已被 .gitignore 排除。
          git add -A society_watch/
          if git diff --cached --quiet; then
            echo "狀態無變化，不 commit。"
          else
            git commit -m "chore: update society watch state [skip ci]"
            # 撞到並行寫入（排程延遲、或使用者自己 push）就 rebase 後重試，
            # 否則整輪狀態隨 runner 蒸發
            git push || (git pull --rebase origin main && git push)
          fi
